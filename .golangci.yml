version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: receiver-naming
        - name: var-naming
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [noctx, unparam, revive]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/RatulSikder97/agentflow]
